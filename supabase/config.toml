# Kiburan local Supabase config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "kiburan"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Deep-link friendly for Expo (scheme: kiburan). Also allow local web/dev URLs.
site_url = "kiburan://"
additional_redirect_urls = [
  "kiburan://**",
  "kiburan://reset-password",
  "exp://127.0.0.1:8081/--/*",
  "exp://localhost:8081/--/*",
  "http://127.0.0.1:8081/**",
  "http://localhost:8081/**",
]
enable_signup = true

[auth.email]
enable_signup = true
# Local default: auto-confirm so sign-up yields a session immediately.
# Set true to exercise the “check your email” path (see docs/authentication.md).
enable_confirmations = false

